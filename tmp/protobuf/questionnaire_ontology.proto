 syntax="proto3";
 package
// metamodel_version: 1.7.0
// version: 2.0.0
// An action that is being or was performed on an individual or entity
message FhirProcedure
 {
  string owlVersionInfo = 0
 repeated  string rdfsLabel = 0
 repeated  string rdfsComment = 0
 repeated  provEntity provHadPrimarySource = 0
 repeated  suloProcess provWasGeneratedBy = 0
 repeated  uriorcurie provType = 0
 repeated  owlThing dctermsHasPart = 0
 repeated  owlThing dctermsIsPartOf = 0
 repeated  datetime provGeneratedAtTime = 0
 repeated  sarefPropertyValue fhirStatus = 0
 repeated  foafAgent dctermsCreator = 0
 repeated  sarefProperty sarefHasProperty = 0
 repeated  sarefPropertyValue sarefHasPropertyValue = 0
 }
// Guidance on how to interpret the value by comparison to a normal or recommended range. Multiple reference ranges are interpreted as an 'OR'. In other words, to represent two distinct target populations, two referenceRange elements would be used.
message FhirReferenceRange
 {
  quantityValue lowRange = 0
  quantityValue highRange = 0
 repeated  quantityValue normalValue = 0
 }
// A ratio of two Quantity values - a numerator and a denominator
message FhirValueRatio
 {
  quantityValue numerator = 0
  quantityValue denominator = 0
 }
