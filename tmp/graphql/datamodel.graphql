    scoreValueId: Uriorcurie!
    scoreValueString: ValueString
    scoreValueNumerical: ValueNumerical
    scoreValueTimeStamp: Datetime!
    scoreValueStatus: ScoreValueStatus!
  }

type Section
  {
    sectionHasOrderedQuestion: [OrderedQuestion]
    sectionHasOrderedSection: [OrderedSection]
    sectionInOrderedSection: [OrderedSection]
    sectionUsesScoreDefinition: [ScoreDefinition]
    sectionAuthoredByOrg: [Organization]
    sectionId: Uriorcurie!
    sectionLabel: String!
  }

type ValueCoding
  {
    code: String!
    display: String!
  }

type ValueDateTime
  {
    dateTimeValue: Datetime
  }

type ValueNumerical
  {
    numericalValue: Decimal!
  }

type ValueString
  {
    stringValue: String!
  }

type Vault
  {
    lastUpdated: Datetime!
    hasQuestionnaireResponse: [QuestionnaireResponse]
    vaultManagedByOrg: Organization!
    vaultId: Uriorcurie!
    birthdate: Datetime
    weight: Weight
    fullName: FullName
  }

type Weight
  {
    numericalValue: Decimal!
    weightType: WeightType!
  }

