---
id: https://w3id.org/faqir/datamodel/entities/procedure
name: procedure

prefixes:
  faqir: https://faqir.org/datamodel/

imports:
  - ../core/identifiers 

classes:
  Procedure:
    description: "A clinical or administrative process that uses resources like questionnaires and observations."
    class_uri: "faqir:Procedure"
    mappings:
      - "fhir:Procedure"
    attributes:
      procedureId:
        description: "unique identifier of the procedure."
        range: uriorcurie
        identifier: true
      procedureLabel:
        description: "Name of the procedure."
        range: string
        required: true
      procedureDescription:
        description: "Description of the procedure"
        range: string
        required: false
    slots:
      - procedurePerformedByOrg
      - procedureHasQuestionnaire

slots:
  procedurePerformedByOrg:
    description: "Organization that manages and perfomes this procedure."
    domain: Procedure
    range: Organization
    required: false
    multivalued: true
    slot_uri: "faqir:procedurePerformedByOrg"
    inverse: organizationPerformsProcedure
  procedureHasQuestionnaire:
    description: "Questionnaires part of this procedure."
    domain: Procedure
    range: Questionnaire
    required: false
    multivalued: true
    slot_uri: "faqir:procedureHasQuestionnaire"
    inverse: questionnairePartOfProcedure