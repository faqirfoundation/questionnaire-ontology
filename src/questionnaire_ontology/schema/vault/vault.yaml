---
id: https://w3id.org/faqir/datamodel/vault
name: vault

prefixes:
    linkml: https://w3id.org/linkml/
    loinc: https://loinc.org/
    ucum: https://unitsofmeasure.org/
    faqir: https://faqir.org/datamodel/

imports:
    - https://w3id.org/linkml/types #linkml:types FAILS
    - ../core/identifiers
    - ../core/types
    - ../core/versions
    - ../entities/organization
    - ../questionnaire/fhir_mappings

classes:

    Vault:
        description: "The FAQIR healthdata vault." 
        class_uri: faqir:vault
        is_a: Metadata
        slots:
            - hasQuestionnaireResponse
            - vaultManagedByOrg
        attributes:
            vaultId: 
                description: "The unique identifier for a vault."
                range: uriorcurie
                identifier: true  
                required: true
            birthdate:
                description: "The date of birth."  
                range: datetime
            weight:
                description: "The weight of the vault's user."
                range: Weight
            full_name:
                description: "The full name of the vault's user."
                range: FullName

    FullName:
        description: "Structured full name."
        attributes:
            first_name:
                range: string
                description: "Given or first name."
            middle_name:
                range: string
                description: "Middle name."
            family_name:
                range: string
                description: "Family or last name."
          
    Weight:
        description: "Weight."
        is_a: ValueNumerical
        attributes:
            weightType:
                description: "The type of weight measurement, e.g. measured or stated."
                range: WeightType
                required: True
        rules:
            - description: "Weight numericalUnit must be a mass unit." # Refine from ucum unit
              preconditions:
                slot_conditions:
                    numericalUnit:
                        is_a: MassUnit


slots:
    hasQuestionnaireResponse:
        description: "QuestionnaireResponse authored by this vault's user."
        domain: Vault
        range: QuestionnaireResponse
        required: false
        multivalued: true
        inverse: questionnaireResponseBySubject

    vaultManagedByOrg:
        description: "Organization managing this vault."
        domain: Vault
        range: Organization
        required: true
        multivalued: false
        inverse: organizationManagesVault
    

enums:

    WeightType:
        description: "Allowed LOINC codes for weight."
        permissible_values:
            BODY_WEIGHT_MEASURED:
                description: Body weight measured
                meaning: loinc:3141-9 # https://loinc.org/3141-9 # loinc:3141-9 ValueError: File "vault.yaml", line 93, col 26: Unknown CURIE prefix: loinc
            BODY_WEIGHT_STATED:
                description: Body weight Stated
                meaning: loinc:3142-7 # https://loinc.org/3142-7 # loinc:3142-7 

    MassUnit:
        description: "Allowed units from UCUM standard for mass."
        permissible_values:
            kg:
                description: "Kilogram"
                meaning: "ucum:kg"  # https://unitsofmeasure.org/ucum.html#kg