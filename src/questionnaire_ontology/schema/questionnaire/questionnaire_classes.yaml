---
id: https://w3id.org/faqir/datamodel/questionnaire/classes
name: questionnaire_classes

prefixes:
  schema: http://schema.org/
  faqir: https://faqir.org/datamodel/
  euVoc:  http://publications.europa.eu/resource/authority/resource-type/
  skos: http://www.w3.org/2004/02/skos/core#

classes:
  QuestionnaireResponse:
    description: "A response to a questionnaire (collection of answers)."
    class_uri: "faqir:QuestionnaireResponse"
    attributes:
      questionnaireResponseId:
        description: "The unique identifier for a specific questionnaire response."
        range: uriorcurie
        identifier: true 
        required: true
      questionnaireResponseStatus:
        description: "The status of the questionnaire response, indicating whether it is 	'in-progress', 'completed', 'amended', 'entered-in-error' or 'stopped'."
        range: QuestionnaireResponseStatus
        required: true
        mappings:
          - "fhir:QuestionnaireResponse.status"
      questionnaireResponseTimeStamp:
        description: "The date and time when the questionnaire response was created (when the questionnaire starts to be answered, not when it's finished)."
        range: datetime
        required: true
        mappings:
          - "fhir:QuestionnaireResponse.authored"
      questionnaireResponseLastUpdated:
        description: "The date and time when the questionnaire response was last updated."
        range: datetime
        required: true
    slots:
      - questionnaireResponseBySubject
      - questionnaireResponseToQuestionnaire
      - questionnaireResponseHasAnswer
      - questionnaireResponseHasDerivedScoreValue
    #rules: 
    ###  - description: "A QuestionnaireResponse must have one subject, one Questionnaire, and at least one Answer."
    ###    postconditions:
    ###      slot_conditions:
    ###        questionnaireResponseBySubject/hasQuestionnaireResponse:    
    ###          equals_expression: "$self"                       # Must point back to this questionnaire
    ###          #message: "QuestionnaireResponse missing or invalid subject (Vault) reference."
    ###        responseHasAnswer/answerInQuestionnaireResponse:
    ###          equals_expression: "$self"   
    ###          #message: "QuestionnaireResponse missing valid reference to a valid Answer. At least one Answer is required."
    ###        questionnaireResponseToQuestionnaire/questionnaireHasQuestionnaireResponse:
    ###          equals_expression: "$self"
    ###          #message: "QuestionnaireResponse missing valid reference to the Questionnaire it responds to."

  Answer:
    description: "Answer in the questionnaire response."
    class_uri: "faqir:Answer" 
    mappings:
      - "fhir:QuestionnaireResponse.item.answer"
    attributes:
      answerId:
        description: "The unique identifier for an answer in the questionnaire response."
        range: uriorcurie
        identifier: true 
        required: true
      answerValueNumerical: # Redefined in rules
        description: "The value of the answer to a decimal or numberInterval type of question, which is a numeric value."
        range: ValueNumerical
        multivalued: false 
        required: false 
        mappings:
          - "fhir:QuestionnaireResponse.item.answer.valueDecimal"
      answerValueString: # Redefined in rules
        description: "The value of the answer to a choice, openChoice or text type of question, which is a stringValue."
        range: ValueString
        multivalued: true #false While validation fails
        required: false 
        mappings:
          - "fhir:QuestionnaireResponse.item.answer.valueString"
      answerValueDateTime: # Redefined in rules
        description: "The value of the answer to a dateTime type of question, which is a datetime value."
        range: ValueDateTime
        multivalued: false 
        required: false 
        mappings:
          - "fhir:QuestionnaireResponse.item.answer.valueDateTime"
      answerIsEmpty:
        description: "True if the answer is intentionally empty."
        range: boolean
        ifabsent: false
      answerTimeStamp:
        description: "The exact date and time when the answer was provided."
        range: datetime
        required: true
    slots:
      - answerInQuestionnaireResponse
      - answerToQuestion
      - questionType # Type of the question this answer is for, guarantee matching Question slot
      - questionMultivaluedAnswer # Whether this answer can be multivalued
    rules:
      - description: "If questionType is 'decimal' or 'numberInterval', answerValueNumerical is required. If questionMultivaluedAnswer is true, answerValueNumerical must be multivalued."
        preconditions:
          slot_conditions:
            answerIsEmpty: false   
            questionType:
              equals_string_in: ["decimal", "numberInterval"]  # Only validate if questionType is 'decimal'
            #questionMultivaluedAnswer: 
            #  equals_expression: true
        postconditions:
          slot_conditions:
            answerValueNumerical:
              required: true
              multivalued: true
              comments:
                "Validation": "numberInterval answerValueNumerical must be between minValue and maxValue"
      - description: "If questionType is 'decimal' or 'numberInterval', answerValueNumerical is required. If questionMultivaluedAnswer is false, answerValueNumerical must not be multivalued."
        preconditions:
          slot_conditions:
            answerIsEmpty: false   
            questionType:
              equals_string_in: ["decimal", "numberInterval"]  # Only validate if questionType is 'decimal'
            #questionMultivaluedAnswer: 
            #  equals_expression: false
        postconditions:
          slot_conditions:
            answerValueNumerical:
              required: true
              multivalued: false
              comments:
                "Validation": "numberInterval answerValueNumerical must be between minValue and maxValue"
      - description: "If questionType is 'choice', 'openChoice', or 'text', answerValueString is required. If questionMultivaluedAnswer is true, answerValueString must be multivalued."
        preconditions:
          slot_conditions:
            answerIsEmpty: false
            questionType:
              equals_string_in: ["choice", "openChoice", "text"]  # Only validate if questionType is 'choice'
            #questionMultivaluedAnswer: 
            #  equals_expression: true
        postconditions:
          slot_conditions:
            answerValueString: # Just codings
              required: true 
              multivalued: true
              comments:
                "Validation": "if choice/openChoice, answerValueString must be a list of strings representing the selected options: codes from the Question's ValueCoding."
      - description: "If questionType is 'choice', 'openChoice', or 'text', answerValueString is required. If questionMultivaluedAnswer is false, answerValueString must not be multivalued."
        preconditions:
          slot_conditions:
            answerIsEmpty: false
            questionType:
              equals_string_in: ["choice", "openChoice", "text"]  # Only validate if questionType is 'choice'
            #questionMultivaluedAnswer: 
            #  equals_expression: false
        postconditions:
          slot_conditions:
            answerValueString: # Just codings
              required: true 
              multivalued: false
              comments:
                "Validation": "if choice/openChoice, answerValueString must be a list of strings representing the selected options: codes from the Question's ValueCoding."
      - description: "If questionType is 'dateTime', answerValueDateTime is required. If questionMultivaluedAnswer is true, answerValueDateTime must be multivalued."
        preconditions:
          slot_conditions:
            answerIsEmpty: false
            questionType:
              equals_string_in: ["dateTime"]  # Only validate if questionType is 'dateTime'
            #questionMultivaluedAnswer: 
            #  equals_expression: true
        postconditions:
          slot_conditions:
            answerValueDateTime:
              required: true
              multivalued: true
      - description: "If questionType is 'dateTime', answerValueDateTime is required. If questionMultivaluedAnswer is false, answerValueDateTime must not be multivalued."
        preconditions:
          slot_conditions:
            answerIsEmpty: false
            questionType:
              equals_string_in: ["dateTime"]  # Only validate if questionType is 'dateTime'
            #questionMultivaluedAnswer: 
            #  equals_expression: false
        postconditions:
          slot_conditions:
            answerValueDateTime:
              required: true
              multivalued: false
      ###- description: "An Answer must be part of a QuestionnaireResponse and linked to a Question."
      ###  #message: "Answer missing required related components. It must be linked to a QuestionnaireResponse and a Question."
      ###  postconditions:
      ###    slot_conditions:
      ###      answerInQuestionnaireResponse/responseHasAnswer:          
      ###        equals_expression: "$self"
      ###        #message: "Answer missing valid reference to the QuestionnaireResponse it belongs to."
      ###      answerToQuestion/questionHasAnswer:
      ###        equals_expression: "$self"
      ###        #message: "Answer missing valid reference to the Question it responds to."

  OrderedQuestion:
    description: "Question's position within a specific questionnaire or section."
    class_uri: "faqir:OrderedQuestion"
    attributes:
      orderedQuestionId:
        description: "The unique identifier for the ordered question."
        range: uriorcurie
        identifier: true 
        required: true
      questionOrder:
        range: integer
        description: "Question position in the questionnaire or section (1-based index)."
        required: true
        minimum_value: 1
    slots:
      - orderedQuestionHasQuestion
      - orderedQuestionPartOfQuestionnaire
      - orderedQuestionPartOfSection
    unique_keys:
      unique_question_order_per_questionnaire:  
        description: "Question order values must be unique per questionnaire"
        unique_key_slots:
          - questionOrder  
          - orderedQuestionPartOfQuestionnaire
      unique_question_order_per_section:  
        description: "Question order values must be unique per section"
        unique_key_slots:
          - questionOrder  
          - orderedQuestionPartOfSection

  Question:
    description: "A question in the questionnaire."
    class_uri: "faqir:Question" 
    mappings:
      - "fhir:Questionnaire.item.where(type='question')"
      - "skos:Concept"
    attributes:
      questionId:
        description: "The unique identifier for a question in the questionnaire."
        range: uriorcurie
        identifier: true 
        required: true
      questionTag:
        description: "Internal English identifier, e.g., 'q_pain_level'."
        range: string
        required: true
      questionLabel: 
        description: "The text of the question itself, which is displayed to the user."
        range: string
        required: true
      questionNumericalParams:
        description: "Unit and Precision limiting the quantitative answer for the question."
        range: NumericalParams
        multivalued: false
        required: false
      questionCodingParams:
        description: "Code and Display of each option offered as answer to the choice or open-choice question."
        range: ValueCoding
        multivalued: true
        required: false
      questionCodingOrdinal:
        description: "Indicates if the choices in a choice or open-choice question are ordered (true) or unordered (false, categorical)."
        range: boolean
        ifabsent: false
      questionIntervalParams:
        description: "Minimum and Maximum limiting the range the answer must be in for the question."
        range: IntervalParams
        multivalued: false
        required: false
      questionRequired:
        description: "Indicates whether answering this question is mandatory (true) or it's optional (false)."
        range: boolean
        ifabsent: false
        mappings:
          - "fhir:Questionnaire.item.required"
    slots:
      - questionType
      - questionAuthoredByOrg
      - questionInOrderedQuestion
      - questionHasAnswer
      - questionMultivaluedAnswer
      - questionUsedInScoreDefinition
    rules:
      - description: "If questionType is 'choice' or 'openChoice', questionCodingParams is required."
        preconditions:
          slot_conditions:
            questionType:
              equals_string_in: ["choice", "openChoice"]  # Only validate if questionType is 'choice' or 'openChoice'
        postconditions:
          slot_conditions:
            questionCodingParams:
              required: true
      - description: "If questionType is 'numberInterval', questionNumericalParams and questionIntervalParams are required."
        preconditions:
          slot_conditions:
            questionType:
              equals_string_in: ["numberInterval"]  # Only validate if questionType is 'numberInterval'
        postconditions:
          slot_conditions:
            questionNumericalParams:
              required: true
            questionIntervalParams:
              required: true
      - description: "If questionType is 'decimal', questionNumericalParams is required."
        preconditions:
          slot_conditions:
            questionType:
              equals_string_in: ["decimal"]  # Only validate if questionType is 'decimal'
        postconditions:
          slot_conditions:
            questionNumericalParams:
              required: true
      ###- description: "A Question must be part of a Questionnaire or Section."
      ###  #message: "Question missing required related components. It must be linked to at least one Questionnaire or Section."
      ###  postconditions:
      ###    any_of:
      ###      - slot_conditions:
      ###          questionPartOfQuestionnaire/questionnaireHasQuestion: 
      ###            equals_expression: "$self"             
      ###            #message: "Question missing valid reference to a Questionnaire that includes it."
      ###      - slot_conditions:
      ###          questionPartOfSection/sectionHasQuestion:
      ###            equals_expression: "$self" 
      ###            #message: "Question missing valid reference to a Section that includes it."

  Questionnaire:
    description: "A questionnaire that can be answered (collection of questions)."
    class_uri: "faqir:Questionnaire" 
    mappings:
      - "fhir:Questionnaire"
      - "euVoc:QUESTIONNAIRE"
    attributes:
      questionnaireId:
        description: "The unique identifier for the questionnaire."
        range: uriorcurie
        identifier: true
        required: true
      questionnaireLabel:
        description: "The label or title of the questionnaire, which is displayed to the user."
        range: string
        required: true
      questionnaireStatus:
        description: "The status of the questionnaire, indicating whether it is draft, active, retired or unknown."
        range: QuestionnaireStatus
        required: true
        mappings:
          - "fhir:Questionnaire.status"
      questionnaireVersion:
        description: "Version of the questionnaire."
        range: string
        pattern: "^\\d+\\.\\d+\\.\\d+$"  # Semantic versioning
        required: true
      questionnaireLastUpdated:
        description: "The date and time when the questionnaire was last updated."
        range: datetime
        required: true
        mappings:
          - "fhir:Questionnaire.date"
    slots:
      - questionnaireHasQuestionnaireResponse
      - questionnaireHasOrderedQuestion
      - questionnaireHasOrderedSection
      - questionnaireUsesScoreDefinition
      - questionnaireAuthoredByOrg
      - questionnairePartOfProcedure
    #rules:
    ###  #- _RulesContainer/questionnaire_structure_rule #- <<: *questionnaire_structure_rule \n\t _from: _RulesContainer
    ###  - description: "A Questionnaire must have at least one Question or Section."
    ###    #message: "Questionnaire missing required related components. It must be linked to at least one Question or Section."
    ###    postconditions:
    ###      any_of:
    ###        - slot_conditions:
    ###            questionnaireHasQuestion/questionPartOfQuestionnaire:  
    ###                equals_expression: "$self"               
    ###              #message: "Questionnaire missing valid reference to a Question that is part of it."  
    ###        - slot_conditions:
    ###            questionnaireHasSection/sectionPartOfQuestionnaire:  
    ###              equals_expression: "$self"
    ###              #message: "Questionnaire missing valid reference to a Section that belongs to it."

  OrderedSection:
    description: "Section's position within a specific questionnaire or section."
    class_uri: "faqir:OrderedSection"
    attributes:
      orderedSectionId:
        description: "The unique identifier for the ordered Section."
        range: uriorcurie
        identifier: true
        required: true
      sectionOrder:
        range: integer
        description: "Section position in the questionnaire or section (1-based index)."
        required: true
        minimum_value: 1
    slots:
      - orderedSectionHasSection
      - orderedSectionPartOfQuestionnaire
      - orderedSectionPartOfSection
    unique_keys:
      unique_section_order_per_questionnaire:  
        description: "Section order values must be unique per questionnaire"
        unique_key_slots:
          - sectionOrder  
          - orderedSectionPartOfQuestionnaire
      unique_section_order_per_section:  
        description: "Section order values must be unique per section"
        unique_key_slots:
          - sectionOrder  
          - orderedSectionPartOfSection

  Section:
    description: "A section of questions in the questionnaire."
    class_uri: "faqir:Section" 
    mappings:
      - "fhir:Questionnaire.item.where(type='group')"
    attributes:
      sectionId:
        description: "The unique identifier for a section in the questionnaire."
        range: uriorcurie
        identifier: true
        required: true
      sectionLabel:
        description: "The label or title of the section, which is displayed to the user."
        range: string
        required: true
    slots:
      - sectionHasOrderedQuestion
      - sectionHasOrderedSection
      - sectionInOrderedSection
      - sectionUsesScoreDefinition
      - sectionAuthoredByOrg
    #rules:
    ###  #- _RulesContainer/section_structure_rule #- <<: *section_structure_rule \n\t _from: _RulesContainer
    ###  - description: "Circular reference detected: Section '{sectionId}' cannot contain itself."
    ###    preconditions:
    ###      slot_conditions:
    ###        hasSubsection:
    ###          required: true
        ###postconditions:
        ###  slot_conditions:
        ###    sectionPartOfSection:
        ###      none_of:
        ###        equals_expression: "$self"
      ###- description: "A Section must have at least one Question or Section."
      ###  #message: "Section missing required related components. It must be linked to at least one Question or Section."
      ###  postconditions:
      ###    any_of:
      ###      - slot_conditions:
      ###          sectionHasQuestion/questionPartOfSection:  
      ###            equals_expression: "$self"           
      ###            #message: "Section missing valid reference to a Question that is part of it."
      ###      - slot_conditions:
      ###          sectionHasSection/sectionPartOfSection:  
      ###            equals_expression: "$self"
      ###            #message: "Section missing valid reference to a Section that belongs to it."   

  ScoreDefinition:
    description: "A score calculated from questions."
    class_uri: "faqir:ScoreDefinition"
    attributes:
      scoreDefinitionId:
        description: "Unique identifier for the score definition."
        range: uriorcurie
        identifier: true 
        required: true
      scoreDefinitionLabel:
        description: "Label or title of the score definition."
        range: string
        required: true
      scoreDefinitionIntervalParams:
        description: "Minimum and maximum values for numerical_percentage and numerical_z_score scores."
        range: IntervalParams
        required: false
      scoreDefinitionFormula:
        description: "The formula used to calculate the score."
        range: string
        required: true
      scoreDefinitionCategories:
        description: "Categories for categorical scores."
        range: string
        multivalued: true
        required: false
      scoreDefinitionInterpretationGuide:
        description: "How to interpret the score values. English explanation."
        range: string
        required: false
    slots:
      - scoreDefinitionType
      - scoreDefinitionHasScoreParameter
      - scoreDefinitionUsesQuestion
      - scoreDefinitionHasScoreValue
      - scoreDefinitionAuthoredByOrg
      - scoreDefinitionUsedByQuestionnare
      - scoreDefinitionUsedBySection
    rules:
      - description: "If scoreDefinitionType is 'categorical', scoreDefinitionCategories is required."
        preconditions:
          slot_conditions:
            scoreDefinitionType:
              equals_string_in: ["categorical"]  
        postconditions:
          slot_conditions:
            scoreDefinitionCategories:
              required: true
      - description: "If scoreDefinitionType is 'numerical_percentage' or 'numerical_z_score', scoreDefinitionIntervalParams is required."
        preconditions:
          slot_conditions:
            scoreDefinitionType:
              equals_string_in: ["numerical_percentage", "numerical_z_score"]  
        postconditions:
          slot_conditions:
            scoreDefinitionIntervalParams:
              required: true

  ScoreParameter:
    description: "Parameters for score definitions, such as min/max values, categories or constants needed."
    class_uri: "faqir:ScoreParameter"
    attributes:
      scoreParameterId:
        description: "Unique identifier for the score parameter."
        range: uriorcurie
        identifier: true 
        required: true
      scoreParameterLabel:
        description: "Label or title of the parameter. Standard English name."
        range: string
        required: true
      scoreParameterType:
        description: "Type of parameter: numerical or dateTime."
        range: ScoreParameterType
        required: true
      scoreParameterValueNumerical:
        description: "Numerical value parameter (e.g., 0.785, 82)."
        range: ValueNumerical
        required: false
      scoreParameterValueDateTime:
        description: "DateTime value parameter formatted as YYYY-MM-DDThh:mm:ss+zz:zz."
        range: ValueDateTime
        required: false
    slots:
      - scoreParameterPartOfScoreDefinition
    rules:
      - description: "If scoreParameterType is 'numerical', scoreParameterValueNumerical is required."
        preconditions:
          slot_conditions:
            scoreParameterType:
              equals_string_in: ["numerical"]  
        postconditions:
          slot_conditions:
            scoreParameterValueNumerical:
              required: true
      - description: "If scoreParameterType is 'dateTime', scoreParameterValueDateTime is required."
        preconditions:
          slot_conditions:
            scoreParameterType:
              equals_string_in: ["dateTime"]  
        postconditions:
          slot_conditions:
            scoreParameterValueDateTime:
              required: true

  ScoreValue:
    description: "The score value calculated from a QuestionnaireResponse following a ScoreDefinition."
    class_uri: "faqir:ScoreValue"
    attributes:
      scoreValueId:
        description: "Unique identifier for the score value."
        range: uriorcurie
        identifier: true 
        required: true
      scoreValueString:
        description: "String representation of the score value, used for categorical scores."
        range: ValueString
        required: false
      scoreValueNumerical:
        description: "Numerical value of the score, used for numerical scores."
        range: ValueNumerical
        required: false
      scoreValueTimeStamp:
        description: "Timestamp when the score value was calculated."
        range: datetime
        required: true
      scoreValueStatus:
        description: "Status of the score value, e.g., draft, final."
        range: ScoreValueStatus
        required: true
    slots:
      - scoreDefinitionType
      - scoreValueBasedOnScoreDefinition
      - scoreValueDerivedFromQuestionnaireResponse
    rules:
      - description: "If scoreDefinitionType is 'categorical', scoreValueString is required."
        preconditions:
          slot_conditions:
            scoreDefinitionType:
              equals_string_in: ["categorical"]  
        postconditions:
          slot_conditions:
            scoreValueString:
              required: true
      - description: "If scoreDefinitionType is 'numerical_continuous', 'numerical_integer', 'numerical_percentage', 'numerical_z_score' or 'numerical_t_score', scoreValueNumerical is required."
        preconditions:
          slot_conditions:
            scoreDefinitionType:
              equals_string_in: ['numerical_continuous', 'numerical_integer', 'numerical_percentage', 'numerical_z_score', 'numerical_t_score']  
        postconditions:
          slot_conditions:
            scoreValueNumerical:
              required: true