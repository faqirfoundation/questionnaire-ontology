scoreDefinitionLabel: EQ-5D-5L score
scoreDefinitionFormula: 'Each state is referred to by a 5-digit code: each digit representing
  the answer to each question or dimension (e.g. 12345).

  The first digit represents the level selected for mobility, the second for self-care,
  the third for usual activities, the fourth for pain/discomfort and the fifth for
  anxiety/depression.

  - Missing values are preferably coded as ‘9’.

  - Ambiguous values (e.g. two boxes are ticked for a single dimension) should

  be treated as missing values.

  '
scoreDefinitionHasScoreValue:
