name: Deploy docs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pipx install poetry && pipx install rust-just
      - run: poetry install
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          just deploy